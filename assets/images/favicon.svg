<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a1a"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="innerStrokeA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glowA" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Squircle base matching .logo__mark -->
  <rect width="512" height="512" rx="124" fill="url(#bgA)"/>
  <rect x="12" y="12" width="488" height="488" rx="114" fill="none" stroke="url(#innerStrokeA)" stroke-width="12"/>

  <!-- Brand 3D layered structure -->
  <g filter="url(#glowA)" fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top diamond -->
    <path d="M256 100 L416 180 L256 260 L96 180 Z" fill="#ffffff" fill-opacity="0.2"/>
    <!-- Middle chevron -->
    <path d="M96 270 L256 350 L416 270"/>
    <!-- Bottom chevron -->
    <path d="M96 360 L256 440 L416 360"/>
  </g>
</svg>
