<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDarkB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151b24"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </linearGradient>
    <linearGradient id="ppuOrangeB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9142"/>
      <stop offset="100%" stop-color="#ff5500"/>
    </linearGradient>
    <linearGradient id="innerPipeB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e0e0"/>
    </linearGradient>
    <linearGradient id="coreHeatB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4500"/>
      <stop offset="100%" stop-color="#ff1a1a"/>
    </linearGradient>
    <filter id="glowB" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#ff6b00" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Dark industrial squircle base with neon accent border -->
  <rect width="512" height="512" rx="124" fill="url(#bgDarkB)"/>
  <rect x="12" y="12" width="488" height="488" rx="114" fill="none" stroke="#253245" stroke-width="10"/>

  <!-- Isometric 3D Pre-insulated Pipe Section -->
  <g transform="translate(256, 256)" filter="url(#glowB)">
    <!-- Outer Casing (ПЭ оболочка) -->
    <ellipse cx="0" cy="0" rx="190" ry="110" fill="#202938" stroke="#3b485d" stroke-width="8"/>
    
    <!-- PPU Foam Layer (Пенополиуретан) -->
    <ellipse cx="0" cy="0" rx="150" ry="86" fill="url(#ppuOrangeB)" stroke="#ff7711" stroke-width="4"/>
    
    <!-- Inner Carrier Pipe PE-RT II (Напорная труба) -->
    <ellipse cx="0" cy="0" rx="88" ry="50" fill="#2a3342" stroke="#ffffff" stroke-width="6"/>
    
    <!-- Thermal Fluid Core (+95°C поток) -->
    <ellipse cx="0" cy="0" rx="55" ry="32" fill="url(#coreHeatB)"/>

    <!-- Subtle technical crosshairs / axis lines for engineering look -->
    <line x1="-190" y1="0" x2="-150" y2="0" stroke="#ff7711" stroke-width="6" stroke-linecap="round"/>
    <line x1="150" y1="0" x2="190" y2="0" stroke="#ff7711" stroke-width="6" stroke-linecap="round"/>
    <line x1="0" y1="-110" x2="0" y2="-86" stroke="#ff7711" stroke-width="6" stroke-linecap="round"/>
    <line x1="0" y1="86" x2="0" y2="110" stroke="#ff7711" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
