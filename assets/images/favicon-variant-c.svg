<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDarkC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141923"/>
      <stop offset="100%" stop-color="#0b0e14"/>
    </linearGradient>
    <linearGradient id="pipeGradC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8822"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <filter id="shadowC" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#ff6b00" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Dark carbon squircle base -->
  <rect width="512" height="512" rx="124" fill="url(#bgDarkC)"/>
  <rect x="12" y="12" width="488" height="488" rx="114" fill="none" stroke="#253245" stroke-width="10"/>

  <!-- Geometric Industrial Monogram "P" made of pipe geometry -->
  <g filter="url(#shadowC)">
    <!-- Vertical pipe stem -->
    <path d="M120 100 L210 100 L210 412 L120 412 Z" fill="url(#pipeGradC)"/>
    
    <!-- Pipe flange on base -->
    <rect x="100" y="396" width="130" height="24" rx="8" fill="#ffffff"/>

    <!-- Outer curved pipe loop of "P" -->
    <path d="M210 100 L320 100 C395 100, 412 145, 412 215 C412 285, 395 330, 320 330 L210 330 Z" fill="url(#pipeGradC)"/>
    
    <!-- Inner hollow bore of the pipe -->
    <path d="M210 170 L305 170 C345 170, 345 260, 305 260 L210 260 Z" fill="#0b0e14"/>

    <!-- High-contrast industrial white pulse dot / flow node in center of loop -->
    <circle cx="280" cy="215" r="28" fill="#ffffff"/>
  </g>
</svg>
